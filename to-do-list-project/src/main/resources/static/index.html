<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>TDL App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>To-Do List</h1>
</header>


<section id="add-task-section">
    <h2>Add Task</h2>
    <form id="add-task-form">
        <input type="text" id="title" placeholder="Title" required>
        <textarea id="description" placeholder="Description (optional)"></textarea>
        <input type="datetime-local" id="dueDate">
        <select id="priority">
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
            <option value="URGENT">Urgent</option>
        </select>
        <button type="submit">Add Task</button>
    </form>
</section>

<!-- Search bar -->
<section id="search-section">
    <input type="text" id="search-input" placeholder="Search tasks...">
    <button id="search-button">Search</button>
</section>

<!-- Filter and sort controls -->
<section id="controls-section">
    <div id="filter-buttons">
        <button data-status="ALL">All</button>
        <button data-status="ONGOING">Pending</button>
        <button data-status="COMPLETED">Completed</button>
        <button data-status="SUSPENDED">Suspended</button>
    </div>
    <div id="sort-buttons">
        <button data-sort="dueDate">Sort by Due Date</button>
        <button data-sort="priority">Sort by Priority</button>
        <button data-sort="status">Sort by Status</button>
    </div>
</section>

<!-- Task list - populated dynamically by JS, not hardcoded here -->
<section id="task-list-section">
    <h2 id="matches-heading" style="display:none;">Matching Tasks</h2>
    <div id="task-list-matches"></div>

    <h2 id="rest-heading" style="display:none;">Other Tasks</h2>
    <div id="task-list-rest"></div>
</section>

<!-- JS -->
<script src="app.js"></script>
</body>
</html>
